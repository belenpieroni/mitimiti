services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      # OCR en la nube (opcional pero recomendado). Conseguí una key gratis en
      # https://ocr.space/ocrapi y ponela en un archivo .env como OCR_SPACE_API_KEY=...
      # Si queda vacía, el backend usa Tesseract local automáticamente.
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
    volumes:
      - ./backend/src:/app/src
      - ./backend/data:/app/data
    restart: unless-stopped

  front:
    build:
      context: .
      dockerfile: Dockerfile.expo
    depends_on:
      - backend
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:3000/api}
      EXPO_NO_TELEMETRY: "1"
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  node_modules: