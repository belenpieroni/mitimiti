services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-mitimiti}
      POSTGRES_USER: ${DB_USER:-mitimiti}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mitimiti_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-mitimiti} -d ${DB_NAME:-mitimiti}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-mitimiti_seguro_2026}
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mitimiti}
      DB_USER: ${DB_USER:-mitimiti}
      DB_PASSWORD: ${DB_PASSWORD:-mitimiti_dev}
      UPLOADS_DIR: /app/uploads
    volumes:
      - ./backend/src:/app/src
      - ./backend/data:/app/data
      - uploads:/app/uploads
    restart: unless-stopped

  front:
    build:
      context: .
      dockerfile: Dockerfile.expo
    depends_on:
      - backend
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:3000/api}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-}
      EXPO_TOKEN: ${EXPO_TOKEN:-}
      EXPO_NO_TELEMETRY: "1"
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  node_modules:
  postgres_data:
  uploads:
